name: Restore author figure captions
on:
  push:
    branches: [fix/reader-original-captions-lightbox]
    paths:
      - scripts/refresh_paper_captions.py
      - .github/workflows/refresh-paper-captions.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: pip install --disable-pip-version-check pymupdf==1.26.4 pillow==11.3.0
      - name: Restore complete author captions and high-res figure crops
        run: python scripts/refresh_paper_captions.py
      - name: Commit verified caption metadata and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/paper-figures.json public/paper-figures/
          if ! git diff --cached --quiet; then
            git commit -m "fix(papers): restore full original captions and higher-resolution figures"
            git fetch origin fix/reader-original-captions-lightbox
            git rebase origin/fix/reader-original-captions-lightbox
            git push origin HEAD:fix/reader-original-captions-lightbox
          fi
