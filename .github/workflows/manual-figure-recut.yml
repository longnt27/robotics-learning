name: Render 22 manually inspected paper galleries

on:
  push:
    branches: [fix/manually-inspected-paper-figures]
    paths:
      - .github/workflows/manual-figure-recut.yml
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: reviewed-figure-recut
  cancel-in-progress: false
jobs:
  source-pdf-crops:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manually-inspected-paper-figures
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies for rasterization, not crop selection
        run: pip install pymupdf==1.26.4 pillow==11.3.0
      - name: Validate exactly 22 reviewed paper records
        run: |
          python -c "import json; m=json.load(open('content/paper-figures.json'));d=json.load(open('content/manually-reviewed-figure-boxes.json'))['papers'];assert set(m)==set(d) and len(d)==22 and sum(map(len,m.values()))==167 and all(x['reviewed_all_figures'] for x in d.values())"
      - name: Render the hand-picked coordinates and commit each paper separately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r slug; do
            echo "::group::Manual review: $slug"
            python -u scripts/render_manually_reviewed_figures.py --paper "$slug"
            python -c "import json,sys,pathlib;from PIL import Image;slug=sys.argv[1];d=json.load(open('content/paper-figures.json'));md=(pathlib.Path('content/papers')/(slug+'.md')).read_text();f=d[slug];assert f;[(lambda x: (x.verify()))(Image.open(pathlib.Path('public')/p['image'].lstrip('/'))) for p in f];assert all(md.count(p['image'])==1 and p.get('caption') and p.get('caption_vi') for p in f);print('VALIDATED',slug,len(f))" "$slug"
            git add "public/paper-figures/$slug" content/paper-figures.json "docs/figure-crop-manual-review/$slug.md"
            if ! git diff --cached --quiet; then
              git commit -m "fix(figures): visually reviewed $slug original PDF figures"
              git push origin HEAD:fix/manually-inspected-paper-figures
            fi
            echo "::endgroup::"
          done < <(python -c "import json;print(*json.load(open('content/paper-figures.json')).keys(),sep='\n')")
      - name: Verify completeness of human review records
        run: |
          python -c "import json,pathlib; d=json.load(open('content/paper-figures.json')); r=pathlib.Path('docs/figure-crop-manual-review');assert len(d)==22 and sum(map(len,d.values()))==167 and all((r/(s+'.md')).is_file() for s in d);print('22 papers, 167 figures audited')"
