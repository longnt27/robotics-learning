name: Probe EnViT5 scientific-caption translation
on:
  push:
    branches: [feat/paper-figures-adaptive-bilingual]
    paths:
      - .github/workflows/probe-envit5.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.44.2 sentencepiece==0.2.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: envit5-caption-translation-model-v1
      - name: Translate representative robotics paper figure captions
        run: |
          python - <<'PY'
          import json,torch
          from pathlib import Path
          from transformers import AutoTokenizer,AutoModelForSeq2SeqLM
          model_name='VietAI/envit5-translation'
          tokenizer=AutoTokenizer.from_pretrained(model_name)
          model=AutoModelForSeq2SeqLM.from_pretrained(model_name)
          model.eval()
          torch.set_num_threads(3)
          data=json.loads(Path('content/paper-figures.json').read_text())
          for slug,n in [('libero',1),('lingbot-vla-2',11),('groot-n1',1),('fast',7)]:
            caption=next(f['caption'] for f in data[slug] if f['number']==n)
            inputs=tokenizer('en: '+caption,return_tensors='pt',truncation=True,max_length=512)
            with torch.inference_mode():
              outputs=model.generate(**inputs,num_beams=3,max_new_tokens=330)
            translated=tokenizer.batch_decode(outputs,skip_special_tokens=True)[0]
            print('SAMPLE',slug,n,flush=True)
            print('ORIGINAL',caption[:620],flush=True)
            print('VI',translated,flush=True)
          PY
