name: Probe translation quality
on:
  push:
    branches: [feat/paper-figures-adaptive-bilingual]
    paths:
      - .github/workflows/probe-translation.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install deep-translator==1.11.4
      - name: Test faithful terminology-aware EN-VI translation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from deep_translator import GoogleTranslator
          data=json.loads(Path('content/paper-figures.json').read_text())
          t=GoogleTranslator(source='en',target='vi')
          for slug,num in [('libero',1),('lingbot-vla-2',11),('groot-n1',1),('fast',7)]:
            fig=next(f for f in data[slug] if f['number']==num)
            print('SOURCE',slug,num,fig['caption'],flush=True)
            try:
              result=t.translate(fig['caption'])
              print('VI',result,flush=True)
            except Exception as e:
              print('ERROR',type(e).__name__,str(e),flush=True)
              raise
          PY
