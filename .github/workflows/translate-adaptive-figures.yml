name: Build bilingual figure gallery
on:
  push:
    branches: [feat/paper-figures-adaptive-bilingual]
    paths:
      - .github/workflows/translate-adaptive-figures.yml
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only translation model runtime
        run: |
          pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --disable-pip-version-check transformers==4.44.2 sentencepiece==0.2.0
      - name: Restore and cache the open-source EN-VI translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: en-vi-opus-mt-caption-v1
      - name: Translate all extracted PDF figure captions to Vietnamese
        run: python scripts/translate_paper_captions.py
      - name: Insert extra figures next to relevant paper chapters
        run: python scripts/place_paper_figures.py
      - name: Validate real per-paper figure counts and bilingual source metadata
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('content/paper-figures.json').read_text())
          counts={slug:len(figs) for slug,figs in data.items()}
          assert len(counts)==22,counts
          assert sum(counts.values())>44,counts
          assert len(set(counts.values()))>=3,counts
          for slug,figs in data.items():
            body=Path('content/papers',slug+'.md').read_text()
            for f in figs:
              assert len(f['caption_vi'])>=12, (slug,f['number'])
              assert f['caption_sha256'] and 'opus-mt-en-vi' in f['translation_method']
              assert f['image'] in body, (slug,f['image'])
              assert body.count(']('+f['image']+')')==1, (slug,f['number'])
          print('FIGURES',counts,'TOTAL',sum(counts.values()),flush=True)
          PY
      - name: Commit translated captions and complete adaptive galleries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/paper-figures.json content/papers/
          if ! git diff --cached --quiet; then
            git commit -m "docs(papers): add Vietnamese caption translations and place all figures"
            git fetch origin feat/paper-figures-adaptive-bilingual
            git rebase origin/feat/paper-figures-adaptive-bilingual
            git push origin HEAD:feat/paper-figures-adaptive-bilingual
          fi
