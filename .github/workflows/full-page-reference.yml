name: Prepare full source-PDF visual references
on:
  push:
    branches: [scratch/visual-figure-reference]
    paths:
      - .github/workflows/full-page-reference.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/visual-figure-reference
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pymupdf==1.26.4 pillow==11.3.0
      - name: Render original paper PDF pages with coordinate grid
        run: python -u scripts/render_full_page_audit_refs.py
      - name: Save unmodified visual source evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .figure-review-previews/pages
          if ! git diff --cached --quiet; then
            git commit -m "docs(review): original PDF page evidence for manual crops"
            git push origin HEAD:scratch/visual-figure-reference
          fi
