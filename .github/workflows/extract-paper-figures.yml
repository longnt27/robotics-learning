name: Extract verified paper figures
on:
  push:
    branches: [feat/deep-paper-explanations-figures]
    paths:
      - scripts/extract_paper_figures.py
      - .github/workflows/extract-paper-figures.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pymupdf==1.26.4 pillow==11.3.0
      - name: Extract source figures from all 22 PDFs
        run: python scripts/extract_paper_figures.py
      - name: Commit inspected PDF crops and caption metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/paper-figures content/paper-figures.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(papers): crop figure panels from source PDFs"
            git push origin HEAD:feat/deep-paper-explanations-figures
          fi
