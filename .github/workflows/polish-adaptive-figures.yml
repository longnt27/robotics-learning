name: Polish bilingual captions and adjacent PDF crops
on:
  push:
    branches: [feat/paper-figures-adaptive-bilingual]
    paths:
      - .github/workflows/polish-adaptive-figures.yml
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pymupdf==1.26.4 pillow==11.3.0
      - name: Remove neighboring captions from multi-figure PDF crops
        run: python scripts/repair_paper_crops.py
      - name: Correct specialized Vietnamese robotics terminology and mixed PDF text
        run: python scripts/polish_figure_caption_data.py
      - name: Verify source and translation traceability
        run: |
          python - <<'PY'
          import json,hashlib,re
          from pathlib import Path
          data=json.loads(Path('content/paper-figures.json').read_text())
          assert len(data)==22
          assert sum(len(figs) for figs in data.values())==167
          for slug,figs in data.items():
            chapter=Path('content/papers',slug+'.md').read_text()
            for f in figs:
              assert len(f['caption'])>32,slug
              assert f['caption_vi'].strip(),(slug,f['number'])
              assert f['caption_sha256']==hashlib.sha256(f['caption'].encode()).hexdigest()
              assert chapter.count(']('+f['image']+')')==1,(slug,f['number'])
              assert (Path('public')/f['image'].lstrip('/')).exists()
          libero=data['libero'][0]['caption_vi']
          assert 'LIBERO-SPATIAL' in libero and 'LIBERO-OBJECT' in libero and 'LIBERO-GOAL' in libero
          print('CAPTIONS_OK 167 figures',flush=True)
          PY
      - name: Commit corrected figures/captions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/paper-figures.json public/paper-figures content/papers
          if ! git diff --cached --quiet; then
            git commit -m "fix(papers): correct source figure overlap and Vietnamese caption terminology"
            git fetch origin feat/paper-figures-adaptive-bilingual
            git rebase origin/feat/paper-figures-adaptive-bilingual
            git push origin HEAD:feat/paper-figures-adaptive-bilingual
          fi
# Trigger rerun after fixing precise LingBot Figure 6 top crop.
