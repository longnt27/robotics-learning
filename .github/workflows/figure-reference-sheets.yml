name: Build visual source-PDF reference sheets
on:
  push:
    branches: [scratch/visual-figure-reference]
    paths:
      - .github/workflows/figure-reference-sheets.yml
      - scripts/create_figure_review_sheets.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/visual-figure-reference
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf==1.26.4 pillow==11.3.0
      - name: Render original paper pages, no crop edits
        run: python -u scripts/create_figure_review_sheets.py
      - name: Persist review-only contact sheets for human inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .figure-review-previews
          git commit -m "docs(review): source PDF reference sheets for manual crop decisions"
          git push origin HEAD:scratch/visual-figure-reference
