name: Final source-page visual crop pass
on:
  push:
    branches: [fix/manually-inspected-paper-figures]
    paths:
      - .github/workflows/figure-visual-third-pass.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit-manual-crops:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manually-inspected-paper-figures
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pymupdf==1.26.4 pillow==11.3.0
      - name: Render final human-selected source-PDF rectangles per paper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for slug in octo open-x-embodiment diffusion-policy rt-2 openvla; do
            echo "::group::$slug"
            python -u scripts/render_manually_reviewed_figures.py --paper "$slug"
            SLUG="$slug" python - <<'PY'
          import json,os,pathlib
          from PIL import Image
          slug=os.environ['SLUG']
          m=json.loads(pathlib.Path('content/paper-figures.json').read_text())
          md=(pathlib.Path('content/papers')/(slug+'.md')).read_text()
          for f in m[slug]:
              p=pathlib.Path('public')/f['image'].lstrip('/')
              with Image.open(p) as im:
                  im.verify()
              assert md.count(f['image'])==1
              assert f.get('caption') and f.get('caption_vi')
          PY
            git add "public/paper-figures/$slug" content/paper-figures.json "docs/figure-crop-manual-review/$slug.md"
            if ! git diff --cached --quiet; then
              git commit -m "fix(figures): final visual crop review for $slug"
              git push origin HEAD:fix/manually-inspected-paper-figures
            fi
            echo "::endgroup::"
          done
